<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>Tindek</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <span class="brand">Tindek</span>
    <span id="mock" class="badge" hidden>MOCK</span>
    <span class="spacer"></span>
    <span id="rate" class="rate" title="Measured sample rate">– Hz</span>
    <span id="conn" class="conn" data-state="closed" title="Connection"></span>
  </header>

  <main>
    <div id="warning" class="warning" hidden></div>

    <section class="readout">
      <div class="weight"><span id="kg">–</span><span class="unit">kg</span></div>
      <button id="peak" class="peak" type="button" title="Tap to reset peak">
        Peak <strong id="peakKg">0.0</strong> kg
      </button>
    </section>

    <section class="actions">
      <button id="tare" class="primary" type="button">Tare</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>

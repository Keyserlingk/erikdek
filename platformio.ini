[platformio]
default_envs = esp32dev

; NodeMCU ESP32 WROOM-32 (CH340). Build: pio run   Flash: pio run -t upload
; The sensor talks Bluetooth LE to the Android app (see PLAN.md).
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Console commands are typed as lines (see lib/core/console_command.h).
monitor_echo = yes
monitor_eol = LF
; tools/version.py: git version in the firmware (BLE Device Information)
extra_scripts = pre:tools/version.py
lib_deps =
  h2zero/NimBLE-Arduino @ ^2.5.1
; Battery voltage (src/battery.cpp): uncomment once a divider is wired to an ADC1 pin
; (GPIO32-39). DIVIDER = (R_top + R_bottom) / R_bottom, e.g. 2.0 for 100k/100k.
;build_flags =
;  -DERKDEK_BATTERY_PIN=35
;  -DERKDEK_BATTERY_DIVIDER=2.0
; Status LED (src/led.cpp): GPIO2 on most boards; set these if yours differs.
;  -DERKDEK_LED_PIN=2
;  -DERKDEK_LED_ACTIVE_LOW=0

; Hardware-independent logic in lib/core, tested on the PC: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17

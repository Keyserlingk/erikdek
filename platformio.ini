[platformio]
default_envs = esp32dev

; NodeMCU ESP32 WROOM-32 (CH340). Build: pio run   Flash: pio run -t upload
; Upload web app (data/): pio run -t uploadfs
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
  esp32async/ESPAsyncWebServer @ ^3.7.0
  esp32async/AsyncTCP @ ^3.3.0
  bblanchon/ArduinoJson @ ^7.0.0

; Hardware-independent logic in lib/core, tested on the PC: pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
